<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestione Collaboratori — Registro aziende</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

html, body { margin: 0; padding: 0; }

.gc-root {
  --carta: #F6F5F1;
  --bianco: #FFFFFF;
  --inchiostro: #262B23;
  --pino: #33513F;
  --pino-scuro: #263D2F;
  --pino-chiaro: #EBF0EA;
  --linea: #E2DFD6;
  --grigio: #82806F;
  --mattone: #8C3B2E;
  --display: 'Archivo', system-ui, sans-serif;
  --testo: 'Figtree', system-ui, sans-serif;
  --dati: 'IBM Plex Mono', 'Courier New', monospace;

  min-height: 100vh;
  background: var(--carta);
  color: var(--inchiostro);
  font-family: var(--testo);
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  align-items: stretch;
}
.gc-root *, .gc-root *::before, .gc-root *::after { box-sizing: border-box; }

/* ---------- struttura: sidebar + contenuto ---------- */
.gc-sidebar {
  width: 250px; flex: none;
  background: var(--bianco); border-right: 1px solid var(--linea);
  padding: 24px 16px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 26px; overflow-y: auto;
}
.gc-marchio { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 0 8px; }
.gc-marchio .nome {
  font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; text-transform: uppercase;
}
.gc-marchio .passo {
  font-family: var(--dati); font-size: 10.5px; color: var(--grigio);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.gc-menu { display: flex; flex-direction: column; gap: 4px; }
.gc-menu-principale {
  display: flex; align-items: center; gap: 9px; width: 100%;
  font-family: var(--dati); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--grigio); background: transparent; border: none; cursor: pointer;
  padding: 8px 8px; border-radius: 8px;
}
.gc-menu-principale:hover { color: var(--pino); }
.gc-menu-principale .chev { margin-left: auto; transition: transform 0.2s ease; }
.gc-menu-principale.aperto .chev { transform: rotate(90deg); }
.gc-sottomenu { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.gc-menu-voce {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  font-family: var(--testo); font-size: 14.5px; color: var(--inchiostro);
  background: transparent; border: 1px solid transparent; border-radius: 10px;
  padding: 10px 12px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
}
.gc-menu-voce .num {
  font-family: var(--dati); font-size: 11px; color: var(--grigio); width: 14px; flex: none; text-align: center;
}
.gc-menu-voce:hover { background: var(--carta); }
.gc-menu-voce.attivo { background: var(--pino-chiaro); border-color: #D3E0D2; color: var(--pino-scuro); font-weight: 500; }
.gc-menu-voce.attivo .num { color: var(--pino); }
.gc-contenuto { flex: 1; min-width: 0; max-width: 1060px; margin: 0 auto; padding: 26px 32px 56px; }

.gc-vista { animation: gc-appare 0.28s ease both; }
@keyframes gc-appare { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .gc-vista { animation: none; }
  .gc-scheda { transition: none !important; }
}

/* ---------- pulsanti ---------- */
.gc-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--testo); font-size: 14px; font-weight: 500;
  padding: 9px 18px; border-radius: 8px; border: 1px solid var(--pino);
  background: var(--pino); color: #fff; cursor: pointer;
}
.gc-btn:hover { background: var(--pino-scuro); border-color: var(--pino-scuro); }
.gc-btn.secondario { background: transparent; color: var(--pino); }
.gc-btn.secondario:hover { background: var(--pino-chiaro); }
.gc-btn.pericolo { background: transparent; border-color: var(--linea); color: var(--mattone); }
.gc-btn.pericolo:hover { border-color: var(--mattone); background: #FBF2F0; }
.gc-btn.fantasma {
  background: transparent; border: 1px dashed var(--linea); color: var(--grigio);
  width: 100%; justify-content: center; padding: 10px;
}
.gc-btn.fantasma:hover { border-color: var(--pino); color: var(--pino); background: var(--pino-chiaro); }
.gc-btn:focus-visible, .gc-menu-voce:focus-visible, .gc-menu-principale:focus-visible, .gc-scheda:focus-visible {
  outline: 2px solid var(--pino); outline-offset: 2px;
}

/* ---------- elenco ---------- */
.gc-intesta-vista { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.gc-titolo { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; text-transform: uppercase; margin: 0; }
.gc-sottotitolo { color: var(--grigio); margin: 6px 0 0; font-size: 14px; }

.gc-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.gc-scheda {
  text-align: left; background: var(--bianco); border: 1px solid var(--linea); border-radius: 12px;
  padding: 20px; cursor: pointer; font-family: var(--testo); color: var(--inchiostro);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  display: flex; flex-direction: column; gap: 14px;
}
.gc-scheda:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(38,43,35,0.08); }
.gc-scheda .testata { display: flex; gap: 14px; align-items: center; }
.gc-sigillo {
  width: 52px; height: 52px; border-radius: 50%; flex: none;
  border: 1px solid var(--pino); box-shadow: inset 0 0 0 3px var(--carta), inset 0 0 0 4px var(--pino);
  background: var(--pino-chiaro); color: var(--pino);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 20px; font-weight: 700;
}
.gc-scheda h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
.gc-scheda .luogo { color: var(--grigio); font-size: 13px; margin-top: 2px; }
.gc-dato { font-family: var(--dati); font-size: 12.5px; color: var(--inchiostro); letter-spacing: 0.02em; }
.gc-dato .etich { color: var(--grigio); }
.gc-scheda .piede {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border-top: 1px solid var(--linea); padding-top: 12px; font-size: 12.5px; color: var(--grigio);
}

.gc-vuoto {
  border: 1px dashed var(--linea); border-radius: 14px; background: var(--bianco);
  padding: 56px 24px; text-align: center; color: var(--grigio);
}
.gc-vuoto .gc-sigillo { margin: 0 auto 16px; }
.gc-vuoto h2 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; text-transform: uppercase; color: var(--inchiostro); margin: 0 0 6px; }
.gc-vuoto p { margin: 0 0 20px; }

/* ---------- dettaglio ---------- */
.gc-torna {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
  color: var(--grigio); font-family: var(--testo); font-size: 14px; cursor: pointer; padding: 4px 0; margin-bottom: 16px;
}
.gc-torna:hover { color: var(--pino); }
.gc-dossier { background: var(--bianco); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.gc-dossier-testa {
  display: flex; gap: 20px; align-items: center; justify-content: space-between;
  padding: 26px 28px; border-bottom: 1px solid var(--linea); flex-wrap: wrap;
}
.gc-dossier-testa .identita { display: flex; gap: 18px; align-items: center; min-width: 0; }
.gc-dossier-testa .gc-sigillo { width: 64px; height: 64px; font-size: 26px; }
.gc-dossier-testa h2 { margin: 0 0 6px; font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; }
.gc-fiscali { display: flex; gap: 14px; flex-wrap: wrap; }
.gc-azioni { display: flex; gap: 10px; flex-wrap: wrap; }

.gc-sezioni { padding: 6px 24px 24px; }
.gc-sezione { padding: 16px 0; border-bottom: 1px solid var(--linea); }
.gc-sezione:first-child { padding-top: 6px; }
.gc-sezione:last-child { border-bottom: none; }
.gc-sezione-titolo {
  display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
  font-family: var(--dati); font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--pino);
  padding-left: 10px; border-left: 3px solid var(--pino);
}
.gc-sezione-titolo svg { color: var(--pino); }
.gc-righe { display: grid; gap: 10px; }
.gc-voce { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.gc-voce .tipo {
  flex: none; min-width: 118px; font-size: 12px; color: var(--grigio);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.gc-colonne { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.gc-contatto { display: flex; align-items: center; gap: 8px; color: var(--inchiostro); text-decoration: none; }
.gc-contatto:hover { color: var(--pino); }
.gc-nessuno { color: var(--grigio); font-style: italic; }

.gc-conferma {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: #FBF2F0; border: 1px solid #E8CFC9; border-radius: 10px;
  padding: 12px 16px; margin-top: 16px; color: var(--mattone); font-size: 14px;
}

/* ---------- modulo ---------- */
.gc-modulo { background: var(--bianco); border: 1px solid var(--linea); border-radius: 14px; padding: 22px 24px; }
.gc-modulo h2 { font-family: var(--display); font-size: 23px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; margin: 0 0 18px; }
.gc-campi { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 11px 14px; align-items: start; }
.gc-campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gc-campo.largo { grid-column: 1 / -1; }
.gc-campo label { font-size: 12px; font-weight: 500; color: var(--grigio); }
.gc-campo input, .gc-campo select {
  font-family: var(--testo); font-size: 14px; color: var(--inchiostro);
  background: var(--carta); border: 1px solid var(--linea); border-radius: 8px;
  padding: 7px 11px; width: 100%;
}
.gc-campo input.dati { font-family: var(--dati); font-size: 13px; letter-spacing: 0.03em; }
.gc-campo input:focus, .gc-campo select:focus { outline: 2px solid var(--pino); outline-offset: 1px; border-color: var(--pino); }
.gc-avviso { font-size: 12px; color: var(--mattone); }

.gc-riga-din { display: grid; gap: 10px; align-items: end; margin-bottom: 8px; }
.gc-riga-sede { grid-template-columns: 150px 1fr 84px 1fr 64px 36px; }
.gc-riga-pos { grid-template-columns: 200px 1fr 36px; }
.gc-togli {
  border: none; background: transparent; color: var(--grigio); cursor: pointer;
  height: 36px; width: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
}
.gc-togli:hover { color: var(--mattone); background: #FBF2F0; }

.gc-modulo-piede {
  display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;
  border-top: 1px solid var(--linea); padding-top: 16px; flex-wrap: wrap;
}
.gc-banner-errore {
  background: #FBF2F0; border: 1px solid #E8CFC9; color: var(--mattone);
  border-radius: 10px; padding: 10px 16px; margin-bottom: 18px; font-size: 14px;
}
.gc-banner-info {
  background: var(--pino-chiaro); border: 1px solid var(--linea); color: var(--pino-scuro);
  border-radius: 10px; padding: 10px 16px; margin-bottom: 18px; font-size: 13.5px;
}
.gc-caricamento { text-align: center; color: var(--grigio); padding: 80px 0; font-size: 14px; }
.gc-pie-pagina {
  margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--linea);
  text-align: center; font-family: var(--dati);
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: #B4B0A6; font-weight: 500;
}
.gc-sidebar-piede { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--linea); display: flex; gap: 8px; }
.gc-sidebar-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 10px; border: 1px solid var(--linea); border-radius: 9px; background: var(--bianco); color: var(--inchiostro); cursor: pointer; font-size: 13px; font-family: var(--testo); }
.gc-sidebar-btn:hover { background: var(--carta); border-color: var(--pino); color: var(--pino-scuro); }
.gc-sidebar-btn.esci:hover { border-color: var(--mattone); color: var(--mattone); background: #FBF2F0; }
.gc-info-pannello { background: var(--bianco); border-radius: 16px; padding: 24px; max-width: 860px; width: 94%; max-height: 86vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.gc-info-pannello .testa { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.gc-info-pannello .testa h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; font-size: 20px; color: var(--pino-scuro); }
.gc-info-lingue { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.gc-info-col .lingua { font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pino); font-weight: 600; padding-left: 10px; border-left: 3px solid var(--pino); margin-bottom: 10px; }
.gc-info-col p { font-size: 13.5px; line-height: 1.55; color: var(--inchiostro); margin: 0 0 10px; }
.gc-info-col ul { margin: 0 0 12px; padding-left: 18px; }
.gc-info-col li { font-size: 13px; line-height: 1.5; margin-bottom: 6px; color: var(--inchiostro); }
.gc-info-col li b { color: var(--pino-scuro); }
@media (max-width: 720px) { .gc-info-lingue { grid-template-columns: 1fr; } }
.gc-uscito { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--carta); padding: 40px 20px; }
.gc-uscito-box { text-align: center; max-width: 420px; }
.gc-uscito-box .marchio { font-family: var(--dati); font-size: 13px; letter-spacing: 0.24em; color: var(--pino); font-weight: 600; margin-bottom: 18px; }
.gc-uscito-box h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 30px; color: var(--pino-scuro); margin: 0 0 10px; }
.gc-uscito-box p { color: var(--grigio); font-size: 15px; margin: 0 0 22px; }
.gc-uscito .gc-pie-pagina { position: absolute; bottom: 24px; border: none; margin: 0; }
/* report / registro attività */
.gc-menu-principale.solo .chev { display: none; }
.gc-menu-principale.solo.attivo { background: var(--pino-chiaro); color: var(--pino-scuro); border-color: var(--pino-chiaro); }
.gc-report-tuo { font-size: 13px; color: var(--grigio); background: var(--carta); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.gc-report-tuo b { color: var(--inchiostro); font-family: var(--dati); }
.gc-report-filtri { display: grid; grid-template-columns: 1fr 160px 160px; gap: 12px; margin-bottom: 16px; align-items: end; }
.gc-report-filtri .gc-campo { margin: 0; }
@media (max-width: 720px) { .gc-report-filtri { grid-template-columns: 1fr; } }
.gc-report-scroll { overflow-x: auto; border: 1px solid var(--linea); border-radius: 12px; }
.gc-report-tab { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.gc-report-tab th { text-align: left; padding: 10px 12px; background: var(--carta); font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grigio); border-bottom: 1px solid var(--linea); }
.gc-report-tab td { padding: 9px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.gc-report-tab tr:last-child td { border-bottom: none; }
.gc-report-tab td.dt { white-space: nowrap; font-family: var(--dati); font-size: 12px; color: var(--grigio); }
.gc-report-tab td.mono { font-family: var(--dati); font-size: 12px; }
/* to-do del responsabile */
.gc-todo-griglia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .gc-todo-griglia { grid-template-columns: 1fr; } }
.gc-todo-col { background: var(--bianco); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; }
.gc-todo-testa { margin-bottom: 12px; }
.gc-todo-testa .tit { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; font-size: 17px; color: var(--pino-scuro); }
.gc-todo-testa .tit svg { color: var(--pino); }
.gc-todo-testa .sub { font-family: var(--dati); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grigio); margin-top: 3px; }
.gc-todo-testa .prog { font-family: var(--dati); font-size: 12px; color: var(--pino); margin-top: 6px; }
.gc-todo-testa .barra { height: 5px; background: var(--carta); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.gc-todo-testa .barra span { display: block; height: 100%; background: var(--pino); border-radius: 999px; transition: width 0.25s; }
.gc-todo-lista { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.gc-todo-voce { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; padding: 7px 8px; border-radius: 9px; }
.gc-todo-voce:hover { background: var(--carta); }
.gc-todo-voce label { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; flex: 1; min-width: 0; }
.gc-todo-voce input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--pino); flex-shrink: 0; }
.gc-todo-voce .testo { font-size: 14px; line-height: 1.4; color: var(--inchiostro); }
.gc-todo-voce.fatto .testo { text-decoration: line-through; color: var(--grigio); }
.gc-todo-voce .gc-togli { height: 26px; width: 26px; opacity: 0; transition: opacity 0.15s; }
.gc-todo-voce:hover .gc-togli { opacity: 1; }
.gc-todo-aggiungi { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linea); }
.gc-todo-aggiungi input { flex: 1; min-width: 0; font-family: var(--testo); font-size: 13.5px; color: var(--inchiostro); background: var(--carta); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 11px; }
.gc-todo-aggiungi input:focus { outline: none; border-color: var(--pino); }
.gc-todo-aggiungi .gc-btn { padding: 8px 12px; }
/* prospetto bonus analitico editabile */
.gc-bonus-prospetto { display: flex; flex-direction: column; gap: 14px; }
.gc-bonus-card { border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
.gc-bonus-card .testa { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 14px; background: var(--carta); border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.gc-bonus-card .testa .n { font-weight: 600; }
.gc-bonus-card .testa .mans { font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--grigio); margin-left: 8px; }
.gc-bonus-card .testa .somma { font-family: var(--dati); font-size: 12.5px; color: var(--grigio); }
.gc-bonus-card .testa .somma b { color: var(--pino-scuro); }
.gc-bonus-righe { display: flex; flex-direction: column; }
.gc-bonus-riga { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.gc-bonus-riga:last-child { border-bottom: none; }
.gc-bonus-riga.on { background: var(--pino-chiaro); }
.gc-bonus-riga .cb { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 190px; font-size: 14px; }
.gc-bonus-riga .cb.small { min-width: 0; font-size: 13px; color: var(--grigio); }
.gc-bonus-riga .cb input { width: 17px; height: 17px; accent-color: var(--pino); }
.gc-bonus-riga .ctr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
.gc-bonus-riga .ctr select { font-family: var(--testo); font-size: 13px; padding: 5px 9px; border: 1px solid var(--linea); border-radius: 7px; background: var(--bianco); }
.gc-bonus-riga .imp { display: flex; align-items: center; gap: 6px; }
.gc-bonus-riga .imp input { width: 90px; font-family: var(--dati); font-size: 13px; padding: 5px 9px; border: 1px solid var(--linea); border-radius: 7px; background: var(--bianco); }
.gc-bonus-riga .imp span { font-size: 12px; color: var(--grigio); }
.gc-bonus-riga .imp .rif { font-family: var(--dati); font-size: 11px; padding: 4px 8px; border: 1px dashed var(--pino); border-radius: 999px; background: transparent; color: var(--pino); cursor: pointer; }
.gc-bonus-riga .imp .rif:hover { background: var(--pino-chiaro); }
.gc-bonus-riga .valauto { font-family: var(--dati); font-size: 12px; color: var(--grigio); }
/* simulatore costo assunzione */
.gc-sim-modale { background: var(--bianco); border-radius: 16px; width: min(760px, 96vw); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
.gc-sim-modale .testa { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.gc-sim-modale .testa h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; font-size: 20px; color: var(--pino-scuro); }
.gc-sim-corpo { padding: 18px 20px; overflow-y: auto; }
.gc-sim-ipotesi { margin: 12px 0 4px; border: 1px solid var(--linea); border-radius: 10px; padding: 0 12px; }
.gc-sim-ipotesi summary { cursor: pointer; font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pino); padding: 10px 2px; }
.gc-sim-ipotesi[open] summary { border-bottom: 1px solid var(--linea); margin-bottom: 12px; }
.gc-sim-ipotesi .gc-campi { padding-bottom: 14px; }
.gc-sim-sintesi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 10px; }
.gc-sim-sintesi .box { border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; }
.gc-sim-sintesi .box.net { background: var(--pino-chiaro); border-color: var(--pino); }
.gc-sim-sintesi .box.az { background: #FBEEEB; border-color: #E3B7AC; }
.gc-sim-sintesi .et { font-family: var(--dati); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grigio); }
.gc-sim-sintesi .v { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--pino-scuro); margin-top: 4px; }
.gc-sim-sintesi .box.az .v { color: var(--mattone); }
.gc-sim-sintesi .v span { font-family: var(--testo); font-weight: 500; font-size: 12px; color: var(--grigio); margin-left: 4px; }
.gc-sim-sintesi .mese { font-family: var(--dati); font-size: 12px; color: var(--grigio); margin-top: 2px; }
.gc-sim-barra { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 8px 0 6px; background: var(--carta); }
.gc-sim-barra .netto { background: var(--pino); }
.gc-sim-barra .tasse { background: var(--mattone); }
.gc-sim-legenda { display: flex; gap: 16px; font-size: 12px; color: var(--grigio); margin-bottom: 14px; }
.gc-sim-legenda .q { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.gc-sim-legenda .q.netto { background: var(--pino); }
.gc-sim-legenda .q.tasse { background: var(--mattone); }
.gc-sim-dettagli { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 12px; }
@media (max-width: 620px) { .gc-sim-sintesi, .gc-sim-dettagli { grid-template-columns: 1fr; } }
.gc-sim-dettagli h4 { font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pino); margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--linea); }
.gc-sim-dettagli .riga { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; color: var(--inchiostro); }
.gc-sim-dettagli .riga span { color: var(--grigio); }
.gc-sim-dettagli .riga.sub b { font-weight: 500; }
.gc-sim-dettagli .riga.tot { border-top: 1px solid var(--linea); margin-top: 4px; padding-top: 7px; font-weight: 600; }
.gc-sim-dettagli .riga.tot b { color: var(--pino-scuro); }
/* storico retributivo */
.gc-retrib-attuale { display: flex; align-items: baseline; gap: 10px; background: var(--pino-chiaro); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
.gc-retrib-attuale span { font-family: var(--dati); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grigio); }
.gc-retrib-attuale b { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--pino-scuro); }
.gc-retrib-attuale .lv { color: var(--pino); }
.gc-retrib-lista { display: flex; flex-direction: column; }
.gc-retrib-voce { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--linea); }
.gc-retrib-voce:last-child { border-bottom: none; }
.gc-retrib-voce .data { font-family: var(--dati); font-size: 12px; color: var(--grigio); width: 92px; flex-shrink: 0; }
.gc-retrib-voce .corpo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
.gc-retrib-voce .tipo { font-family: var(--dati); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; background: var(--carta); color: var(--grigio); }
.gc-retrib-voce .tipo.t-promozione { background: var(--pino); color: #fff; }
.gc-retrib-voce .tipo.t-aumento { background: var(--pino-chiaro); color: var(--pino-scuro); }
.gc-retrib-voce .imp { font-family: var(--dati); font-size: 13px; font-weight: 600; }
.gc-retrib-voce .delta { font-family: var(--dati); font-size: 12px; padding: 1px 7px; border-radius: 999px; }
.gc-retrib-voce .delta.su { background: #E7F0E9; color: var(--pino-scuro); }
.gc-retrib-voce .delta.giu { background: #FBEEEB; color: var(--mattone); }
.gc-retrib-voce .lv { font-size: 12px; color: var(--pino); }
.gc-retrib-voce .nota { font-size: 12.5px; color: var(--grigio); }
.gc-retrib-form { border: 1px solid var(--linea); border-radius: 10px; padding: 14px; margin-top: 12px; background: var(--carta); }
.gc-invio-ok { background: var(--pino) !important; border-color: var(--pino) !important; color: #fff !important; }
.gc-invio-ko { background: #FBEEEB !important; border-color: var(--mattone) !important; color: var(--mattone) !important; }
/* riposo lavorato (straordinario da pagare) */
.gc-riposolav-tag { display: inline-flex; align-items: center; background: var(--mattone); color: #fff; font-family: var(--dati); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; margin-left: 8px; white-space: nowrap; }
.gc-riposolav-banner { display: flex; align-items: flex-start; gap: 10px; background: #FBEEEB; border: 1px solid #E3B7AC; border-left: 4px solid var(--mattone); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; color: var(--mattone); }
.gc-riposolav-banner svg { flex-shrink: 0; margin-top: 1px; }
.gc-riposolav-banner b { color: var(--mattone); }
.gc-riposolav-box { background: #FBEEEB; border: 1px solid #E3B7AC; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13px; color: var(--inchiostro); }
.gc-riposolav-box b { color: var(--mattone); }
.gc-riposolav-box .date { font-family: var(--dati); font-size: 12px; color: var(--mattone); margin-top: 4px; }
.gc-riposolav-box .nota { color: var(--grigio); font-size: 12px; margin-top: 6px; }

/* ---------- schede interne (tab) ---------- */
.gc-tabs { display: flex; gap: 4px; padding: 14px 28px 0; border-bottom: 1px solid var(--linea); }
.gc-tab {
  font-family: var(--testo); font-size: 14px; padding: 8px 14px;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--grigio); cursor: pointer;
}
.gc-tab.attiva { color: var(--pino); border-bottom-color: var(--pino); font-weight: 600; }
.gc-tab:focus-visible { outline: 2px solid var(--pino); outline-offset: 2px; }

/* ---------- giorni di apertura ---------- */
.gc-giorni { display: flex; gap: 8px; flex-wrap: wrap; }
.gc-giorno {
  font-family: var(--dati); font-size: 12px; letter-spacing: 0.04em;
  padding: 6px 13px; border-radius: 999px; border: 1px solid var(--linea);
  color: var(--grigio); background: var(--bianco);
}
.gc-giorno.aperto { background: var(--pino); border-color: var(--pino); color: #fff; }
button.gc-giorno { cursor: pointer; }
button.gc-giorno:hover { border-color: var(--pino); color: var(--pino); }
button.gc-giorno.aperto:hover { background: var(--pino-scuro); color: #fff; }
button.gc-giorno:focus-visible { outline: 2px solid var(--pino); outline-offset: 2px; }

/* ---------- reparti e mansioni (vista dossier) ---------- */
.gc-reparto { border: 1px solid var(--linea); border-radius: 12px; padding: 18px; margin-bottom: 14px; background: var(--carta); }
.gc-reparto-testa { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.gc-reparto-testa h4 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.005em; }
.gc-reparto-testa .conteggio { font-size: 12.5px; color: var(--grigio); }
.gc-mansione { background: var(--bianco); border: 1px solid var(--linea); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.gc-mansione:last-child { margin-bottom: 0; }
.gc-mansione-testa { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.gc-mansione-testa .nome-m { font-weight: 600; }
.gc-etichette { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.gc-chip {
  font-family: var(--dati); font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--pino-chiaro); color: var(--pino-scuro); border: 1px solid var(--linea);
}
.gc-chip.neutra { background: var(--carta); color: var(--grigio); }

/* ---------- modulo esigenza operativa ---------- */
.gc-riga-nome { grid-template-columns: 1fr 36px; }
.gc-riga-reparto { grid-template-columns: 1fr 280px 36px; }
.gc-sede-intesta {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 600; color: var(--pino-scuro);
  margin: 18px 0 10px;
}
.gc-sede-intesta:first-of-type { margin-top: 0; }
.gc-demo-tag {
  font-family: var(--dati); font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--grigio);
  border: 1px solid var(--linea); border-radius: 999px; padding: 2px 8px;
  vertical-align: middle; margin-left: 8px; white-space: nowrap;
}

/* ---------- collaboratori ---------- */
.gc-stato {
  font-family: var(--dati); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  border: 1px solid var(--linea); background: var(--bianco); color: var(--grigio);
}
.gc-stato.candidato { background: #FBF4E6; border-color: #E8D9B4; color: #8A6A1E; }
.gc-stato.assunto { background: var(--pino); border-color: var(--pino); color: #fff; }
.gc-stato.cessato { background: var(--carta); border-color: var(--linea); color: var(--grigio); }
.gc-gruppo-stato { margin-bottom: 26px; }
.gc-gruppo-stato > h2 {
  font-family: var(--dati); font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--grigio); margin: 0 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.gc-scheda .sotto-nome { color: var(--grigio); font-size: 13px; margin-top: 2px; }
.gc-scheda-testa-riga { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

/* documenti */
.gc-doc { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--linea); border-radius: 10px; background: var(--bianco); margin-bottom: 8px; }
.gc-doc .icona-doc { flex: none; color: var(--pino); }
.gc-doc .info { min-width: 0; flex: 1; }
.gc-doc .nome-doc { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-doc .meta-doc { font-size: 12px; color: var(--grigio); }
.gc-doc .azioni-doc { display: flex; gap: 4px; flex: none; }
.gc-doc a, .gc-doc button.icona-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--linea);
  background: var(--bianco); color: var(--grigio); cursor: pointer; text-decoration: none;
}
.gc-doc a:hover, .gc-doc button.icona-btn:hover { border-color: var(--pino); color: var(--pino); }
.gc-doc button.icona-btn.pericolo:hover { border-color: var(--mattone); color: var(--mattone); background: #FBF2F0; }
.gc-upload {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-family: var(--testo); font-size: 14px; font-weight: 500;
  padding: 9px 18px; border-radius: 8px; border: 1px dashed var(--linea);
  color: var(--grigio); background: transparent; width: 100%; justify-content: center;
}
.gc-upload:hover { border-color: var(--pino); color: var(--pino); background: var(--pino-chiaro); }
.gc-upload input { display: none; }

/* checkbox e toggle riga */
.gc-check {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--linea); border-radius: 8px; background: var(--bianco);
  cursor: pointer; font-size: 14px; user-select: none;
}
.gc-check.attivo { border-color: var(--pino); background: var(--pino-chiaro); color: var(--pino-scuro); }
.gc-check .box {
  width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--linea);
  flex: none; display: flex; align-items: center; justify-content: center; color: #fff; background: var(--bianco);
}
.gc-check.attivo .box { background: var(--pino); border-color: var(--pino); }
.gc-check-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }

/* bonus concesso */
.gc-bonus-blocco { border: 1px solid var(--linea); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: var(--bianco); }
.gc-bonus-testa { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; font-weight: 600; }
.gc-riga-inc { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); display: grid; gap: 8px; }
.gc-riga-permesso { grid-template-columns: 170px 1fr 36px; }
.gc-riga-assegnazione { grid-template-columns: 1fr 1fr; }

/* riepilogo costi contratto */
.gc-recap { border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
.gc-recap-riga { display: flex; justify-content: space-between; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--linea); }
.gc-recap-riga:last-child { border-bottom: none; }
.gc-recap-riga .voce { color: var(--inchiostro); }
.gc-recap-riga .valore { font-family: var(--dati); font-size: 13px; }
.gc-recap-riga.totale { background: var(--pino-chiaro); font-weight: 600; }
.gc-recap-riga.totale .valore { color: var(--pino-scuro); }
.gc-pill-si { color: var(--pino); font-weight: 600; }
.gc-pill-no { color: var(--grigio); }
.gc-nota-auto { font-family: var(--dati); font-size: 11px; color: var(--grigio); margin-top: 4px; display: block; }
.gc-cessazione {
  border: 1px solid #E4C7C1; background: #FBF2F0; border-radius: 12px; padding: 18px 20px; margin-top: 16px;
}
.gc-cessazione h4 { margin: 0 0 12px; font-size: 14px; color: var(--mattone); display: flex; align-items: center; gap: 8px; }
.gc-cessazione .gc-modulo-piede { margin-top: 16px; padding-top: 16px; }
.gc-banner-cessato {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border: 1px solid var(--linea); background: var(--carta); border-radius: 10px;
  padding: 11px 16px; margin-top: 14px; font-size: 13.5px; color: var(--grigio);
}
.gc-banner-cessato strong { color: var(--inchiostro); font-weight: 600; }

/* scadenze documenti / formazione */
.gc-scadenza-tag {
  font-family: var(--dati); font-size: 10px; font-weight: 500;
  letter-spacing: 0.05em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap; margin-left: 8px;
}
.gc-scadenza-tag.valido { background: var(--pino-chiaro); color: var(--pino-scuro); }
.gc-scadenza-tag.scadenza { background: #FBF4E6; color: #8A6A1E; }
.gc-scadenza-tag.scaduto { background: #FBF2F0; color: var(--mattone); }
.gc-formazione-riga {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border: 1px solid var(--linea); border-radius: 10px;
  background: var(--bianco); margin-bottom: 8px; flex-wrap: wrap;
}
.gc-formazione-riga .titolo { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.gc-formazione-riga .date { font-family: var(--dati); font-size: 12.5px; color: var(--grigio); display: flex; gap: 14px; flex-wrap: wrap; }
.gc-formazione-riga .date b { color: var(--inchiostro); font-weight: 500; }
.gc-riga-corso { grid-template-columns: 1fr 170px 170px; }
.gc-riga-emergenza { grid-template-columns: 1fr 160px 180px; }

/* ---------- pianificazione ---------- */
.gc-piano-barra { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.gc-piano-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gc-piano-periodo { font-family: var(--dati); font-size: 13px; color: var(--grigio); padding: 0 4px; }
.gc-piano-periodo b { color: var(--inchiostro); }
.gc-legenda { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--grigio); }
.gc-legenda-voce { display: inline-flex; align-items: center; gap: 6px; }
.gc-legenda-box { width: 26px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--dati); font-size: 11px; }
.gc-legenda-box.corretto-demo { border: 1px solid var(--linea); box-shadow: inset 0 0 0 2px var(--pino); }

.gc-piano-scroll { overflow-x: auto; border: 1px solid var(--linea); border-radius: 12px; background: var(--bianco); }
.gc-piano-tab { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: max-content; min-width: 100%; }
.gc-piano-tab th, .gc-piano-tab td { border-bottom: 1px solid var(--linea); border-right: 1px solid var(--linea); padding: 6px 8px; text-align: center; white-space: nowrap; position: relative; }
.gc-piano-tab thead th { position: sticky; top: 0; z-index: 2; background: var(--carta); font-family: var(--dati); font-size: 11px; font-weight: 500; color: var(--grigio); line-height: 1.3; }
.gc-piano-tab thead th .data { color: var(--inchiostro); }
.gc-piano-tab thead th.weekend { color: var(--mattone); }
.gc-piano-tab thead th.oggi { background: var(--pino-chiaro); color: var(--pino-scuro); }
.gc-piano-tab th.ang, .gc-piano-tab th.nome, .gc-piano-tab th.mans {
  position: sticky; left: 0; z-index: 1; text-align: left;
  min-width: 200px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; background: var(--bianco);
}
.gc-piano-tab thead th.ang { z-index: 3; background: var(--carta); }
.gc-piano-tab th.nome { font-weight: 500; color: var(--inchiostro); }
.gc-piano-tab .riga-reparto th {
  position: sticky; left: 0; background: var(--pino); color: #fff; text-align: left;
  font-family: var(--dati); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 10px;
}
.gc-piano-tab .riga-mansione th.mans { background: var(--pino-chiaro); font-weight: 600; color: var(--pino-scuro); }
.gc-piano-tab .riga-mansione th.mans .req { font-family: var(--dati); font-size: 10px; color: var(--grigio); font-weight: 400; margin-left: 6px; }
.gc-piano-tab td.cop { font-family: var(--dati); font-size: 11px; background: var(--pino-chiaro); color: var(--pino-scuro); }
.gc-piano-tab td.cop.ko { background: var(--mattone); color: #fff; font-weight: 600; }
.gc-piano-tab td.cop.chiuso { background: #F0EFEA; color: #C9C7BE; }

.gc-piano-tab td.cella { cursor: pointer; font-family: var(--dati); font-weight: 600; min-width: 56px; }
.gc-piano-tab td.cella .turni { display: flex; flex-direction: column; gap: 1px; align-items: center; }
.gc-piano-tab td.cella .turno { font-size: 11px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.35; }
.gc-piano-tab td.cella .ore { display: block; font-size: 9.5px; font-weight: 400; opacity: 0.85; }
.gc-turni-lista { display: flex; flex-wrap: wrap; gap: 6px; }
.gc-turno-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; border-radius: 7px; background: var(--pino-chiaro); color: var(--pino-scuro); font-family: var(--dati); font-size: 12px; }

.gc-sovr-panel { border: 1px solid #EBC9C1; background: #FBEEEB; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.gc-sovr-panel .testa { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: var(--mattone); margin-bottom: 10px; }
.gc-sovr-panel .lista { display: flex; flex-direction: column; gap: 6px; }
.gc-sovr-riga { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 7px 10px; border-radius: 8px; background: #FBF4E6; border: 1px solid #E8D9B4; font-size: 13px; }
.gc-sovr-riga.critica { background: #F7E0DA; border-color: #E3B7AC; }
.gc-sovr-riga .date { font-family: var(--dati); font-size: 12px; white-space: nowrap; }
.gc-sovr-riga .chi { color: var(--inchiostro); }
.gc-sovr-riga .tag-critica { font-family: var(--dati); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--mattone); color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: auto; }
.gc-reg-editor { width: 100%; min-height: 420px; padding: 18px 20px; border: 1px solid var(--linea); border-radius: 12px; background: var(--bianco); font-family: var(--testo); font-size: 14.5px; line-height: 1.6; color: var(--inchiostro); resize: vertical; }
.gc-reg-editor:focus { outline: none; border-color: var(--pino); }
.gc-reg-testo { background: var(--bianco); border: 1px solid var(--linea); border-radius: 12px; padding: 24px 28px; max-width: 760px; }
.gc-reg-testo p { margin: 0 0 4px; font-size: 15px; line-height: 1.65; color: #2E2C26; }
.gc-reg-testo p:empty::before { content: ""; }
.gc-turni-scelta { display: flex; flex-wrap: wrap; gap: 8px; }
.gc-turni-scelta .gc-check { width: auto; }

/* giorni cliccabili */
.gc-piano-tab thead th.cliccabile { cursor: pointer; }
.gc-piano-tab thead th.cliccabile:hover { background: var(--pino-chiaro); color: var(--pino-scuro); }

/* vista giornaliera 24h */
.gc-gg-scroll { overflow-x: auto; border: 1px solid var(--linea); border-radius: 12px; background: var(--bianco); }
.gc-gg { min-width: 960px; }
.gc-gg-riga { display: flex; align-items: stretch; border-bottom: 1px solid var(--linea); }
.gc-gg-riga.testa { position: sticky; top: 0; z-index: 3; }
.gc-gg-riga .nome {
  flex: none; width: 220px; padding: 8px 12px; border-right: 1px solid var(--linea);
  font-size: 13px; position: sticky; left: 0; background: var(--bianco); z-index: 2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gc-gg-riga.testa .nome { background: var(--carta); font-family: var(--dati); font-size: 11px; color: var(--grigio); }
.gc-gg-riga .nome .turno-nome { font-family: var(--dati); font-size: 11px; color: var(--pino); }
.gc-gg-riga .track {
  position: relative; flex: 1; min-width: 720px; height: 36px;
  background-image: repeating-linear-gradient(90deg, var(--linea) 0, var(--linea) 1px, transparent 1px, transparent calc(100% / 24));
}
.gc-gg-riga.testa .track.testa-ore { height: 26px; background: var(--carta); }
.track.testa-ore span { position: absolute; top: 7px; transform: translateX(-50%); font-family: var(--dati); font-size: 10px; color: var(--grigio); }
.track.testa-ore span:first-child { transform: none; }
.gc-gg-riga .barra {
  position: absolute; top: 6px; bottom: 6px; background: var(--pino); color: #fff; border-radius: 6px;
  font-family: var(--dati); font-size: 10.5px; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 0 6px; white-space: nowrap; min-width: 3px;
}
.gc-gg-riga .barra.vuoto { background: repeating-linear-gradient(45deg, #E7F0E7, #E7F0E7 5px, #DCE8DC 5px, #DCE8DC 10px); color: var(--pino-scuro); }
.gc-gg-riga .gg-stato { align-self: center; margin-left: 12px; font-size: 12.5px; color: var(--grigio); }
.gc-gg-riga:not(.testa):hover { background: #FBFBF9; cursor: pointer; }
.gc-gg-riga:not(.testa):hover .nome { background: #FBFBF9; }
.gc-gg-reparto {
  position: sticky; left: 0; background: var(--pino); color: #fff; font-family: var(--dati);
  font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px;
}
.gc-gg-mansione {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--pino-chiaro); padding: 6px 12px; font-weight: 600; color: var(--pino-scuro); font-size: 12.5px;
  position: sticky; left: 0;
}
.gc-gg-mansione .cop { font-family: var(--dati); font-size: 11px; font-weight: 500; color: var(--pino-scuro); }
.gc-gg-mansione .cop.ko { color: var(--mattone); }
.gc-gg-turni { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 6px 12px 8px; background: #F5F7F4; border-bottom: 1px solid var(--linea); font-size: 11.5px; color: var(--grigio); font-family: var(--dati); }
.gc-gg-turni .turno-cop b { color: var(--pino-scuro); }
.gc-gg-turni .turno-cop.scoperto { color: var(--mattone); }
.gc-gg-turni .turno-cop.scoperto b { color: var(--mattone); }

/* marcatori sostituzione */
.gc-piano-tab td.cella.sost::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #C58A2E; }
.gc-gg-riga .barra.sost { background: #C58A2E; }

/* proposta di sostituzione nell'editor */
.gc-sostituzione { border-top: 1px solid var(--linea); margin-top: 14px; padding-top: 16px; }
.gc-sostituzione h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; color: var(--pino-scuro); }
.gc-proposta { border: 1px solid var(--linea); border-radius: 10px; padding: 14px; background: var(--bianco); }
.gc-proposta .chi { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.gc-proposta .chi .nome { font-weight: 600; }
.gc-proposta .chi .perche { font-size: 12.5px; color: var(--grigio); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.gc-proposta .azioni { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.gc-chip.prio-0 { background: var(--pino); color: #fff; border-color: var(--pino); }
.gc-chip.prio-1 { background: #FBF4E6; color: #8A6A1E; border-color: #E8D9B4; }
.gc-chip.prio-2 { background: var(--carta); color: var(--grigio); }

/* ---------- chiusura mensile ---------- */
.gc-eco-tab { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: max-content; min-width: 100%; }
.gc-eco-tab th, .gc-eco-tab td { border-bottom: 1px solid var(--linea); padding: 8px 12px; text-align: right; white-space: nowrap; font-family: var(--dati); }
.gc-eco-tab thead th { position: sticky; top: 0; z-index: 2; background: var(--carta); font-family: var(--testo); font-size: 11px; font-weight: 500; color: var(--grigio); text-transform: uppercase; letter-spacing: 0.04em; }
.gc-eco-tab th.nome, .gc-eco-tab thead th.nome { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--bianco); min-width: 210px; font-family: var(--testo); }
.gc-eco-tab thead th.nome { z-index: 3; background: var(--carta); }
.gc-eco-tab tbody tr.riga-collab { cursor: pointer; }
.gc-eco-tab tbody tr.riga-collab:hover td, .gc-eco-tab tbody tr.riga-collab:hover th.nome { background: #FBFBF9; }
.gc-eco-tab th.nome { font-weight: 600; }
.gc-eco-tab th.nome .mans { font-family: var(--dati); font-size: 11px; color: var(--grigio); font-weight: 400; margin-top: 2px; padding-left: 19px; }
.gc-eco-tab th.nome .chev { transition: transform 0.2s; margin-right: 5px; vertical-align: middle; color: var(--grigio); }
.gc-eco-tab th.nome .chev.giu { transform: rotate(90deg); }
.gc-eco-tab th.nome .gc-scadenza-tag { margin-left: 8px; }
.gc-eco-tab td.spicca { color: var(--mattone); font-weight: 600; }
.gc-eco-tab td.netto { font-weight: 600; color: var(--pino-scuro); }
.gc-eco-tab td.costo { font-weight: 600; background: var(--carta); }
.gc-eco-tab tfoot th, .gc-eco-tab tfoot td { position: sticky; bottom: 0; background: var(--pino-chiaro); font-weight: 600; color: var(--pino-scuro); border-top: 1px solid var(--linea); }
.gc-eco-tab tfoot th.nome { z-index: 1; }
.riga-dettaglio td { background: var(--carta); text-align: left; white-space: normal; font-family: var(--testo); }
.gc-eco-dettaglio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 6px 4px; }
.gc-eco-dettaglio h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grigio); }
.gc-eco-dettaglio p { margin: 0 0 6px; font-size: 13px; }
.gc-eco-dettaglio ul { margin: 0; padding-left: 16px; font-size: 13px; }
.gc-eco-dettaglio li { margin-bottom: 4px; }
.gc-eco-legenda { border: 1px solid var(--linea); border-radius: 12px; background: var(--bianco); padding: 16px 18px; margin-bottom: 18px; }
.gc-eco-legenda h4 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grigio); }
.gc-eco-legenda dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 24px; }
.gc-eco-legenda dt { font-weight: 600; font-size: 13px; color: var(--pino-scuro); }
.gc-eco-legenda dd { margin: 2px 0 0; font-size: 12.5px; color: var(--grigio); line-height: 1.45; }
.gc-eco-tab td.manuale { padding: 4px 6px; }
.gc-eco-tab input.eco-input {
  width: 96px; font-family: var(--dati); font-size: 12.5px; text-align: right;
  padding: 6px 8px; border: 1px solid var(--linea); border-radius: 7px; background: var(--bianco); color: var(--inchiostro);
}
.gc-eco-tab input.eco-input:focus { outline: none; border-color: var(--pino); }
.gc-eco-tab input.eco-input::placeholder { color: #BEBCB2; font-size: 11px; }

.gc-riga-chiusura { grid-template-columns: 170px 170px 1fr 36px; }
.gc-riga-chiusura.con-sede { grid-template-columns: minmax(150px, 1fr) 150px 150px 1.4fr 36px; }
.gc-riga-mansione { grid-template-columns: 1fr 100px 130px 140px 36px; }
.gc-riga-turno { grid-template-columns: 1fr 130px 130px 90px 36px; }
.gc-blocco-reparto { border: 1px solid var(--linea); border-radius: 12px; padding: 16px; margin-bottom: 14px; background: var(--carta); }
.gc-blocco-mansione { border: 1px solid var(--linea); border-radius: 10px; padding: 14px; margin: 10px 0; background: var(--bianco); }
.gc-sotto-titolo {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--grigio); margin: 12px 0 8px;
}
.gc-ore { font-family: var(--dati); font-size: 12.5px; color: var(--pino-scuro); padding: 11px 0; }

/* ---------- servizi in-house ---------- */
.gc-servizio-voce { margin-bottom: 12px; }
.gc-servizio {
  display: inline-flex; align-items: center; gap: 9px; justify-content: flex-start;
  font-family: var(--testo); font-size: 14px; font-weight: 500;
  min-width: 210px; padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--linea); background: var(--bianco); color: var(--grigio); cursor: pointer;
}
.gc-servizio:hover { border-color: var(--pino); color: var(--pino); }
.gc-servizio.attivo { background: var(--pino); border-color: var(--pino); color: #fff; }
.gc-servizio.attivo:hover { background: var(--pino-scuro); }
.gc-servizio:focus-visible { outline: 2px solid var(--pino); outline-offset: 2px; }
.gc-servizio-pannello {
  margin-top: 8px; padding: 14px; background: var(--carta);
  border: 1px solid var(--linea); border-radius: 10px;
}
.gc-servizio-pannello .gc-campo input, .gc-servizio-pannello .gc-campo select { background: var(--bianco); }
.gc-riga-mensa { grid-template-columns: 140px 180px 160px 1fr; }
.gc-riga-alloggio { grid-template-columns: 1fr 100px 110px 180px 36px; }
.gc-riga-mezzo { grid-template-columns: 1fr 170px 36px; }
.gc-riga-lavanderia { grid-template-columns: 105px 115px 150px 180px 1fr; }
.gc-riga-bus { grid-template-columns: 170px 170px 1fr; }
.gc-riga-capo { grid-template-columns: 1fr 150px 36px; }
.gc-servizio-tipo {
  flex: none; min-width: 170px; display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--grigio); text-transform: uppercase; letter-spacing: 0.05em;
}

@media (max-width: 720px) {
  .gc-root { flex-direction: column; }
  .gc-sidebar {
    width: 100%; height: auto; position: static; flex-direction: column;
    border-right: none; border-bottom: 1px solid var(--linea); gap: 14px; padding: 16px;
  }
  .gc-sottomenu { flex-direction: row; flex-wrap: wrap; }
  .gc-menu-voce { width: auto; }
  .gc-contenuto { padding: 22px 16px 48px; }
  .gc-campi { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .gc-riga-sede, .gc-riga-pos, .gc-riga-chiusura, .gc-riga-chiusura.con-sede, .gc-riga-mansione, .gc-riga-turno, .gc-riga-nome, .gc-riga-reparto { grid-template-columns: 1fr; }
  .gc-riga-mensa, .gc-riga-alloggio, .gc-riga-mezzo, .gc-riga-lavanderia, .gc-riga-bus, .gc-riga-capo { grid-template-columns: 1fr; }
  .gc-riga-permesso, .gc-riga-assegnazione { grid-template-columns: 1fr; }
  .gc-riga-corso, .gc-riga-emergenza { grid-template-columns: 1fr; }
  .gc-servizio { width: 100%; }
  .gc-colonne { grid-template-columns: 1fr; }
  .gc-togli { justify-self: end; }
  .gc-tabs { padding: 10px 16px 0; overflow-x: auto; }
}
</style>

<script>
/* Codice precompilato da JSX con Babel (nessuna compilazione nel browser). */
const {
  useState,
  useEffect
} = React;
const STORAGE_KEY = "gestionale:aziende";

/* ---------- archivio dati: usa lo storage persistente se disponibile,
   altrimenti conserva i dati in memoria per la sessione corrente ---------- */
const memoria = {};
const storagePersistente = () => typeof window.storage === "object" && window.storage !== null && typeof window.storage.get === "function" && typeof window.storage.set === "function";
const firebasePronto = () => typeof window.__db === "object" && window.__db !== null;
const chiaveFb = k => "gestionale/" + String(k).replace(/[.#$\[\]/:]/g, "_");

/* dati condivisi tra tutti i dispositivi che aprono l'app */
const CONDIVISO = true;
const archivio = {
  get persistente() {
    return firebasePronto() || storagePersistente();
  },
  condiviso: CONDIVISO,
  get online() {
    return firebasePronto();
  },
  async get(chiave) {
    if (firebasePronto()) {
      const snap = await window.__db.ref(chiaveFb(chiave)).once("value");
      if (!snap.exists()) throw new Error("Chiave non trovata");
      return {
        key: chiave,
        value: snap.val()
      };
    }
    if (storagePersistente()) return await window.storage.get(chiave, CONDIVISO);
    if (memoria[chiave] === undefined) throw new Error("Chiave non trovata");
    return {
      key: chiave,
      value: memoria[chiave]
    };
  },
  async set(chiave, valore) {
    if (firebasePronto()) {
      await window.__db.ref(chiaveFb(chiave)).set(valore);
      return {
        key: chiave,
        value: valore
      };
    }
    if (storagePersistente()) return await window.storage.set(chiave, valore, CONDIVISO);
    memoria[chiave] = valore;
    return {
      key: chiave,
      value: valore
    };
  },
  /* ascolto realtime: richiama cb(valore) a ogni modifica (solo con Firebase) */
  ascolta(chiave, cb) {
    if (!firebasePronto()) return () => {};
    const ref = window.__db.ref(chiaveFb(chiave));
    const h = ref.on("value", snap => {
      try {
        cb(snap.exists() ? snap.val() : null);
      } catch (e) {}
    });
    return () => ref.off("value", h);
  }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- esigenza operativa: strutture dati ---------- */
const GIORNI = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];

/* ---------- servizi in-house per i collaboratori ---------- */
const SERVIZI = [{
  chiave: "mensa",
  nome: "Mensa"
}, {
  chiave: "alloggi",
  nome: "Alloggi"
}, {
  chiave: "auto",
  nome: "Auto di servizio"
}, {
  chiave: "bus",
  nome: "Tessere bus"
}, {
  chiave: "lavanderia",
  nome: "Lavanderia"
}, {
  chiave: "abbigliamento",
  nome: "Abbigliamento di lavoro"
}, {
  chiave: "spaccio",
  nome: "Spaccio"
}];
const CAPI_LAVORO = ["Grembiule", "Maglietta", "Camicetta", "Giacca", "Pantalone", "Gilet", "Giacca invernale", "Cappello", "Berretto"];
const nuoviServizi = () => ({
  mensa: {
    attivo: false,
    posti: "",
    costoPasto: "",
    costoMese: "",
    nota: ""
  },
  alloggi: {
    attivo: false,
    unita: [],
    nota: ""
  },
  auto: {
    attivo: false,
    mezzi: [],
    costoMese: "",
    nota: ""
  },
  bus: {
    attivo: false,
    costoGiorno: "",
    costoMese: "",
    nota: ""
  },
  lavanderia: {
    attivo: false,
    lavatrici: "",
    asciugatrici: "",
    costoLavaggio: "",
    lavaggiSettimana: "",
    nota: ""
  },
  abbigliamento: {
    attivo: false,
    capi: [],
    nota: ""
  },
  spaccio: {
    attivo: false,
    nota: ""
  }
});
const nuovoCapo = () => ({
  id: uid(),
  nome: "",
  costo: ""
});
const nuovoAlloggio = () => ({
  id: uid(),
  locazione: "",
  stanza: "",
  postiLetto: "",
  costoMercato: ""
});
const nuovoMezzo = () => ({
  id: uid(),
  descrizione: "",
  targa: ""
});

/* integra i servizi salvati in precedenza con i nuovi campi di dettaglio */
const normalizzaServizi = salvati => {
  const base = nuoviServizi();
  const dati = salvati || {};
  const uniti = Object.fromEntries(Object.keys(base).map(k => [k, {
    ...base[k],
    ...(dati[k] || {})
  }]));
  uniti.alloggi.unita = (uniti.alloggi.unita || []).map(u => ({
    costoMercato: "",
    ...u
  }));
  return uniti;
};

/* riga di riepilogo mostrata accanto al nome del servizio */
const riepilogoServizio = (chiave, st) => {
  if (chiave === "mensa") {
    const parti = [];
    if (st.posti !== "" && st.posti != null) parti.push(`${st.posti} ${Number(st.posti) === 1 ? "posto" : "posti"} a tavola`);
    if (st.costoPasto !== "" && st.costoPasto != null) parti.push(`${euro(st.costoPasto)} / pasto completo`);
    if (st.costoMese !== "" && st.costoMese != null) parti.push(`${euro(st.costoMese)} / mese`);
    return parti.join(" · ");
  }
  if (chiave === "alloggi") {
    const unita = (st.unita || []).filter(u => u.locazione || u.stanza || u.postiLetto || u.costoMercato);
    if (!unita.length) return "";
    const letti = unita.reduce((t, u) => t + (Number(u.postiLetto) || 0), 0);
    const mercato = unita.reduce((t, u) => t + (Number(u.costoMercato) || 0), 0);
    let r = `${unita.length} ${unita.length === 1 ? "alloggio" : "alloggi"}`;
    if (letti) r += ` · ${letti} ${letti === 1 ? "posto letto" : "posti letto"}`;
    if (mercato) r += ` · valore di mercato ${euro(mercato)} / mese`;
    return r;
  }
  if (chiave === "auto") {
    const mezzi = (st.mezzi || []).filter(m => m.descrizione || m.targa);
    const parti = [];
    if (mezzi.length) parti.push(`${mezzi.length} ${mezzi.length === 1 ? "mezzo" : "mezzi"}`);
    if (st.costoMese !== "" && st.costoMese != null) parti.push(`${euro(st.costoMese)} / mese`);
    return parti.join(" · ");
  }
  if (chiave === "bus") {
    const parti = [];
    if (st.costoGiorno !== "" && st.costoGiorno != null) parti.push(`${euro(st.costoGiorno)} / giorno`);
    if (st.costoMese !== "" && st.costoMese != null) parti.push(`${euro(st.costoMese)} / mese`);
    return parti.join(" · ");
  }
  if (chiave === "lavanderia") {
    const parti = [];

    if (st.costoLavaggio !== "" && st.costoLavaggio != null) parti.push(`${euro(st.costoLavaggio)} / lavaggio`);

    const capi = (st.capi || []).filter(c => c.nome || c.costo);

const oreTurno = (inizio, fine) => {
  if (!inizio || !fine) return 0;
  const [h1, m1] = inizio.split(":").map(Number);
  const [h2, m2] = fine.split(":").map(Number);
  let minuti = h2 * 60 + m2 - (h1 * 60 + m1);
  if (minuti <= 0) minuti += 24 * 60; /* turno a cavallo della mezzanotte */
  return minuti / 60;
};

  });

};

/* stato di una scadenza: scaduto / in scadenza (≤60 gg) / valido */
const statoScadenza = data => {
  if (!data) return null;
  const oggi = new Date();
  oggi.setHours(0, 0, 0, 0);
  const d = new Date(data + "T00:00:00");
  if (isNaN(d)) return null;
  const giorni = Math.round((d - oggi) / 86400000);
  if (giorni < 0) return {
    classe: "scaduto",
    testo: "scaduto"
  };
  if (giorni <= 60) return {
    classe: "scadenza",
    testo: "in scadenza"
  };
  return {
    classe: "valido",
    testo: "valido"
  };
};

  return m.turni.filter(t => t.inizio && t.fine).map(t => (t.nome ? t.nome + " " : "") + t.inizio + "–" + t.fine).join(", ");
};
const descriviAssegnazione = (azienda, repartoId, mansioneId) => {
  if (!azienda || !azienda.operativo) return {
    descrizione: "",
    orario: ""
  };
  const rep = azienda.operativo.reparti.find(r => r.id === repartoId);
  if (!rep) return {
    descrizione: "",
    orario: ""
  };
  const man = rep.mansioni.find(m => m.id === mansioneId);
  const sede = (azienda.sedi || []).find(s => s.id === rep.sedeId);
  const luogo = sede ? etichettaSede(sede) : "";
  const parti = [man && man.nome, rep.nome, luogo].filter(Boolean);
  return {
    descrizione: parti.join(" · "),
    orario: orarioMansione(man)
  };
};

/* compone l'assegnazione da mansione a testo libero + reparto facoltativo;
   se la mansione coincide con una definita in azienda ne recupera turni/orario */
const componiAssegnazione = (azienda, repartoId, mansioneNome) => {
  const rep = azienda && azienda.operativo ? azienda.operativo.reparti.find(r => r.id === repartoId) : null;
  const sede = rep && (azienda.sedi || []).find(s => s.id === rep.sedeId);
  const luogo = sede ? etichettaSede(sede) : "";
  const man = rep && (mansioneNome || "") ? rep.mansioni.find(m => (m.nome || "").trim().toLowerCase() === mansioneNome.trim().toLowerCase()) : null;
  const nomeAzienda = azienda ? azienda.ragioneSociale : "";
  const parti = [mansioneNome, rep && rep.nome, luogo || (!rep ? nomeAzienda : "")].filter(Boolean);
  return {
    descrizione: parti.join(" · "),
    orario: orarioMansione(man),
    mansioneId: man ? man.id : ""
  };
};

/* costo mensile di riferimento del bonus, dai dati aziendali */
const valoreBonusAzienda = (azienda, chiave, riferimentoId) => {
  const s = azienda && azienda.servizi && azienda.servizi[chiave];
  if (!s) return null;
  if (chiave === "mensa") return s.costoMese !== "" ? Number(s.costoMese) : null;
  if (chiave === "bus") return s.costoMese !== "" ? Number(s.costoMese) : null;
  if (chiave === "auto") return s.costoMese !== "" ? Number(s.costoMese) : null;
  if (chiave === "alloggi") {
    const u = (s.unita || []).find(x => x.id === riferimentoId);
    return u && u.costoMercato !== "" ? Number(u.costoMercato) : null;
  }
  if (chiave === "lavanderia") {
    if (s.costoLavaggio === "" || s.lavaggiSettimana === "") return null;
    return Math.round(Number(s.costoLavaggio) * Number(s.lavaggiSettimana) * 4.33 * 100) / 100;
  }
  if (chiave === "abbigliamento") {
    const tot = (s.capi || []).reduce((t, c) => t + (Number(c.costo) || 0), 0);
    return tot || null;
  }
  return null;
};

  r.onload = () => res(r.result);
  r.onerror = () => rej(new Error("lettura non riuscita"));
  r.readAsDataURL(file);
});

/* --- date --- */
const isoToDate = iso => new Date(iso + "T00:00:00");

  const d = isoToDate(iso);

};

  return `${d.getDate()}/${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const giorniFinestra = (startISO, n = 14) => Array.from({
  length: n
}, (_, i) => {
  const iso = isoAdd(startISO, i);
  const idx = idxGiorno(iso);
  return {
    iso,
    idx,
    abbr: GIORNI[idx],
    weekend: idx >= 5
  };
});

/* ore giornaliere stimate per persona */
const oreGiornaliere = (azienda, collab) => {
  const co = collab.contratto;
  if (co.oreSettimanali) {
    const op = azienda && azienda.operativo || {};
    const aperti = op.giorniApertura && op.giorniApertura.length ? op.giorniApertura.length : 6;
    const lavorativi = Math.max(1, aperti - (co.giornoLibero ? 1 : 0));
    return Math.round(Number(co.oreSettimanali) / lavorativi * 10) / 10;
  }
  const a = (co.assegnazioni || [])[0];
  if (a && azienda && azienda.operativo) {
    const rep = azienda.operativo.reparti.find(r => r.id === a.repartoId);
    const man = rep && rep.mansioni.find(m => m.id === a.mansioneId || (m.nome || "").trim().toLowerCase() === (a.mansione || "").trim().toLowerCase());
    if (man && man.turni && man.turni.length) {
      const oreMax = Math.max(...man.turni.map(tr => oreTurno(tr.inizio, tr.fine)));
      if (oreMax) return Math.round(oreMax * 10) / 10;
    }
  }
  return 8;
};
const giornoChiuso = (azienda, iso) => {
  const op = azienda && azienda.operativo || {};
  if ((op.chiusure || []).some(c => c.dal && c.al && iso >= c.dal && iso <= c.al)) return true;
  const idx = idxGiorno(iso);
  if (op.giorniApertura && op.giorniApertura.length && !op.giorniApertura.includes(GIORNI[idx])) return true;
  return false;
};

/* ricava la fascia oraria del turno (dall'orario del contratto o dai turni della mansione) */
const estraiOrario = testo => {
  const m = (testo || "").match(/(\d{1,2})[:.](\d{2})\s*[–\-—]\s*(\d{1,2})[:.](\d{2})/);
  if (!m) return null;
  return {
    inizio: m[1].padStart(2, "0") + ":" + m[2],
    fine: m[3].padStart(2, "0") + ":" + m[4]
  };
};
/* tutti i turni presenti nel testo dell'orario (es. "Mattina 07:00–15:00, Pomeriggio 15:00–23:00") */
const estraiOrari = testo => {
  const re = /(\d{1,2})[:.](\d{2})\s*[–\-—]\s*(\d{1,2})[:.](\d{2})/g;
  const out = [];
  let m;
  while ((m = re.exec(testo || "")) !== null) out.push({
    inizio: m[1].padStart(2, "0") + ":" + m[2],
    fine: m[3].padStart(2, "0") + ":" + m[4]
  });
  return out;
};
/* turni definiti nell'esigenza operativa per la mansione del collaboratore */
const turniMansione = (azienda, collab) => {
  const a = (collab.contratto.assegnazioni || [])[0];
  if (!a) return [];
  if (a.orariPersonalizzati && Array.isArray(a.turni)) return a.turni.filter(t => t.inizio && t.fine);
  if (!azienda || !azienda.operativo) return [];
  const reparti = azienda.operativo.reparti;
  const nome = (a.mansione || "").trim().toLowerCase();
  let man = null;
  if (a.repartoId) {
    const rep = reparti.find(r => r.id === a.repartoId);
    man = rep && rep.mansioni.find(m => m.id === a.mansioneId || (m.nome || "").trim().toLowerCase() === nome);
  }
  if (!man) {
    for (const rep of reparti) {
      man = rep.mansioni.find(m => m.id === a.mansioneId || (m.nome || "").trim().toLowerCase() === nome && nome);
      if (man) break;
    }
  }
  return man && man.turni ? man.turni.filter(t => t.inizio && t.fine) : [];
};
const turnoDefault = (azienda, collab) => {
  /* priorità ai turni definiti ORA nell'esigenza operativa della mansione */
  const turni = turniMansione(azienda, collab);
  if (turni.length) return {
    inizio: turni[0].inizio,
    fine: turni[0].fine
  };
  /* in mancanza, l'eventuale orario indicato nel contratto */
  const a = (collab.contratto.assegnazioni || [])[0];
  const parsed = a && estraiOrario(a.orario);
  if (parsed) return parsed;
  return null;
};
const fmtOra = t => {
  if (!t) return "";
  const [h, m] = t.split(":");
  return m === "00" ? String(Number(h)) : Number(h) + ":" + m;
};
const fmtTurno = (i, f) => i && f ? fmtOra(i) + "–" + fmtOra(f) : "";
const oreToMin = t => {
  const [h, m] = (t || "0:0").split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
};
const segmentiTurno = (inizio, fine) => {
  const s = oreToMin(inizio),
    e = oreToMin(fine);
  if (e > s) return [[s, e]];
  return [[s, 1440], [0, e]]; /* turno a cavallo della mezzanotte */
};
const sovrapposti = (iA, fA, iB, fB) => {
  const sA = segmentiTurno(iA, fA),
    sB = segmentiTurno(iB, fB);
  return sA.some(([s1, e1]) => sB.some(([s2, e2]) => s1 < e2 && s2 < e1));
};
/* lista dei turni effettivi di una cella (compatibile col vecchio formato inizio/fine) */
const turniCella = eff => {
  if (eff && eff.turni && eff.turni.length) return eff.turni;
  if (eff && eff.inizio && eff.fine) return [{
    inizio: eff.inizio,
    fine: eff.fine
  }];
  return [];
};
const oreTurni = turni => turni.reduce((s, t) => s + (oreTurno(t.inizio, t.fine) || 0), 0);
const turniDiMansione = (azienda, repId, manNome) => {
  if (!azienda || !azienda.operativo) return [];
  const nome = (manNome || "").trim().toLowerCase();
  const reparti = azienda.operativo.reparti;
  let man = null;
  if (repId) {
    const rep = reparti.find(r => r.id === repId);
    man = rep && rep.mansioni.find(m => (m.nome || "").trim().toLowerCase() === nome);
  }
  if (!man && nome) {
    for (const rep of reparti) {
      man = rep.mansioni.find(m => (m.nome || "").trim().toLowerCase() === nome);
      if (man) break;
    }
  }
  return man && man.turni ? man.turni.filter(t => t.inizio && t.fine) : [];
};
/* turni effettivi di un'assegnazione: personalizzati per il collaboratore oppure standard della mansione */
const turniAssegnazione = (azienda, a) => {
  if (!a) return [];
  if (a.orariPersonalizzati && Array.isArray(a.turni)) return a.turni.filter(t => t.inizio && t.fine);
  return turniDiMansione(azienda, a.repartoId, a.mansione);
};
/* turno assegnato al collaboratore, con rotazione settimanale tra i turni
   della mansione, sfasata tra colleghi di pari mansione (così ciascuno fa
   sia mattino sia pomeriggio e ogni turno resta coperto) */
const turnoAssegnato = (azienda, collaboratori, collab, iso) => {
  const turni = turniMansione(azienda, collab);
  if (!turni.length) return null;
  if (turni.length === 1) return {
    inizio: turni[0].inizio,
    fine: turni[0].fine
  };
  let pos = 0;
  if (collaboratori) {
    const a = (collab.contratto.assegnazioni || [])[0] || {};
    const repId = a.repartoId || "";
    const manKey = (a.mansione || a.descrizione || "").trim().toLowerCase();
    const colleghi = collaboratori.filter(c => {
      if (c.contratto.aziendaId !== collab.contratto.aziendaId || c.stato === "candidato") return false;
      const xa = (c.contratto.assegnazioni || [])[0] || {};
      return (xa.repartoId || "") === repId && (xa.mansione || xa.descrizione || "").trim().toLowerCase() === manKey;
    }).sort((x, y) => (x.cognome || x.nome || "").localeCompare(y.cognome || y.nome || "") || String(x.id).localeCompare(String(y.id)));
    const p = colleghi.findIndex(c => c.id === collab.id);
    if (p >= 0) pos = p;
  }
  let settimana = 0;
  if (iso) settimana = Math.floor(isoToDate(lunediDi(iso)).getTime() / 86400000 / 7);
  const idx = ((settimana + pos) % turni.length + turni.length) % turni.length;

    inizio: t.inizio,
    fine: t.fine

};
const cellaAuto = (azienda, collab, iso, collaboratori) => {
  const co = collab.contratto;
  if (co.dataInizio && iso < co.dataInizio) return {
    stato: "fuori",
    ore: 0,
    motivo: ""
  };
  if (co.dataFine && iso > co.dataFine) return {
    stato: "fuori",
    ore: 0,
    motivo: ""
  };
  if (collab.stato === "cessato" && collab.cessazione.data && iso > collab.cessazione.data) return {
    stato: "fuori",
    ore: 0,
    motivo: ""
  };
  if (giornoChiuso(azienda, iso)) return {
    stato: "chiusura",
    ore: 0,
    motivo: ""
  };
  const ass = (collab.assenze || []).find(a => a.dal && iso >= a.dal && iso <= (a.al || a.dal));
  if (ass) return {
    stato: ["ferie", "permesso", "malattia", "assente"].includes(ass.tipo) ? ass.tipo : "ferie",
    ore: 0,
    motivo: ass.nota || ""
  };
  const idx = idxGiorno(iso);
  if (co.giornoLibero && co.giornoLibero === GIORNI_ESTESI[idx]) return {
    stato: "riposo",
    ore: 0,
    motivo: ""
  };
  const perm = (collab.candidatura.permessi || []).find(p => p.data === iso);
  if (perm) return {
    stato: "permesso",
    ore: 0,
    motivo: perm.motivo || ""
  };
  const turniM = turniMansione(azienda, collab);
  if (turniM.length) {
    const tt = turniM.map(t => ({
      inizio: t.inizio,
      fine: t.fine,
      nome: t.nome || ""
    }));
    return {
      stato: "presente",
      turni: tt,
      ore: Math.round(oreTurni(tt) * 10) / 10,
      motivo: ""
    };
  }
  const a = (collab.contratto.assegnazioni || [])[0];
  const daTesto = a ? estraiOrari(a.orario) : [];
  if (daTesto.length) {
    return {
      stato: "presente",
      turni: daTesto,
      ore: Math.round(oreTurni(daTesto) * 10) / 10,
      motivo: ""
    };
  }
  return {
    stato: "presente",
    turni: [],
    ore: oreGiornaliere(azienda, collab),
    motivo: ""

/* raggruppa i collaboratori per reparto → mansione, con fabbisogno persone */
const gruppiPiano = (azienda, collaboratori) => {
  const reparti = azienda && azienda.operativo && azienda.operativo.reparti || [];
  const mappa = new Map();
  collaboratori.forEach(c => {
    const a = (c.contratto.assegnazioni || [])[0] || {};
    const repId = a.repartoId || "";
    const rep = reparti.find(r => r.id === repId);
    const repNome = rep ? rep.nome : "Senza reparto";
    const manNome = (a.mansione || a.descrizione || "Senza mansione").trim() || "Senza mansione";
    if (!mappa.has(repId)) mappa.set(repId, {
      id: repId,
      nome: repNome,
      mansioni: new Map()
    });
    const repG = mappa.get(repId);
    const manKey = manNome.toLowerCase();
    if (!repG.mansioni.has(manKey)) {
      const man = rep && rep.mansioni.find(m => (m.nome || "").trim().toLowerCase() === manKey);
      repG.mansioni.set(manKey, {
        nome: manNome,
        richiesti: man && man.persone !== "" && man.persone != null ? Number(man.persone) : null,
        collab: []
      });
    }
    repG.mansioni.get(manKey).collab.push(c);
  });
  return [...mappa.values()].map(r => ({
    ...r,
    mansioni: [...r.mansioni.values()]

};
